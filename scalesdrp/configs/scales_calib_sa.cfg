[SCALES]
#
# Configuration file for SCALES calibration module
#

#
#
#Processing configuration
#
#

#Redo the slope image generation even if the products exist
clobber = False

#Skip the generation of combined master cal files,
#go straight to spectral extraction analysis
skip_mcal_generation = False

#do you like to create new rectmat
create_rectmat=False

#Generate a second set of rectification matrices while
#applying an x and/or y shift to compensate for disperser motion?
rectmat_xshift = 0
rectmat_yshift = 0
rectmat_fluxcut = 0.0
apply_destripe = True
medres_force_ysigma = True


##odd even column swapping in detector fast mode
do_swap = False
#
#
#detector level corrections
nchans=4
altcol=True
channelwise=True
amp_mean_func=robust.mean
do_acn=True
acn_avg_type='pix'
acn_mean_func=np.median
acn_smooth=True
acn_savgol=False
acn_winsize=31
acn_order=3
resid_colsub=False
fixcol=True
ref_avg_type='row_wise'
ref_mean_func=np.median
ref_smooth=True
ref_savgol=False
ref_winsize=31
ref_order=3
pickup=False
sigma_thresh=4.0
dilate_iter=2
highpass_size=101
per_amp=False


##linearity correction needed or not
do_linearity = True
#Do you wanted to create linearity coeffs
create_linearity_coeff = False
min_lin_files = 2 #minimum flat ramps needed for lin coeff
min_lin_reads = 30 #minimum number of reads per ramp

##################################################
create_readnoise=False
min_rn_reads = 2
minimum_rn_ramps=3
rn_sub_global = True
rn_sub_amp = False
rn_sub_row = True

#Do you like to apply saturation mask to ramp fitting
apply_sat_mask=True
######################################################
#do you like to create saturation map
create_sat_map = True
minimum_detected_ramps=2
min_sat_reads=30
drop_fraction = 0.85
minimum_saturation_dn = 1200.0
#################################################
#Do you like to apply bad pixel mask to the slope image?
apply_bpm = True
#create bad pixel mask from dark and flat slope images
#######################################################
create_bpm = False
bpm_min_darks=3
bpm_min_flats=3

im_dark_spatial_sigma_thresh =8.0
im_dark_spatial_kernel_size = 7
im_dark_min_frames_bad_spatial = 4
im_dark_row_correction = True
im_dark_row_suppression_fraction = 0.20
im_dark_hot_sigma = 2.5
im_dark_cold_sigma = 3.0
im_dark_temporal_sigma_thresh = 15.0
im_flat_temporal_sigma_thresh=12.0
im_flat_spatial_sigma_thresh=8.0
im_flat_spatial_kernel_size=7
im_flat_min_frames_bad_spatial=3
im_normalize_flats=True
im_flat_norm_kernel_size=31
im_flat_row_correction=True
im_flat_row_suppression_fraction=0.20
im_flat_low_response_thresh=0.3
im_flat_high_response_thresh=1.4

ifs_dark_spatial_sigma_thresh =8.0
ifs_dark_spatial_kernel_size = 7
ifs_dark_min_frames_bad_spatial = 4
ifs_dark_hot_sigma = 6.0
ifs_dark_cold_sigma = 5.0
ifs_dark_temporal_sigma_thresh = 10.0
ifs_flat_temporal_sigma_thresh=12.0
ifs_flat_spatial_sigma_thresh=8.0
ifs_flat_spatial_kernel_size=7
ifs_flat_min_frames_bad_spatial=3
ifs_normalize_flats=True
ifs_flat_norm_kernel_size=31
ifs_flat_low_response_thresh=0.3
ifs_flat_high_response_thresh=1.4

########################################################
#method use to make master calib files.
#'ivw', 'mean', or 'median'
master_comb_met = 'median'

#Set output directory
output_directory = 'redux/'
plot_directory = 'plots/'

#Path to folder containing required calibration files
#(currently must be a subdirectory inside scalesdrp)
calib_file_path = 'calib/'

#Calibration file names (must be inside calib directory)
sig_map_ifs_fast0p6 = 'readnoise_ifs_fast0.6_cd5.fits'
flat_ifs_fast0p6 = 'ifs_fast0.6_mflatlamp.fits'
bpm_ifs = 'bpm_ifs.fits'
bpmat_ifs = 'bpmat_ifs.npz'
lin_coeff_ifs_fast0p6 = 'linearity_ifs_fast0.6.fits'
sat_map_ifs_fast0p6 = 'ifs_fast0.6_sat_map.fits'
gain_ifs_fast0p6 = 1.0

sig_map_ifs_fast1 = 'readnoise_ifs_fast1.0_cd5.fits'
flat_ifs_fast1 = 'ifs_fast0.6_pseudoflat_bpcorr.fits'
lin_coeff_ifs_fast1 = 'linearity_ifs_fast1.0.fits'
sat_map_ifs_fast1 = 'ifs_fast1.0_sat_map.fits'
gain_ifs_fast1 = 1.0

sig_map_ifs_slow = 'readnoise_ifs_slow_cd5.fits'
flat_ifs_slow = 'ifs_fast0.6_pseudoflat_bpcorr.fits'
lin_coeff_ifs_slow = 'linearity_ifs_slow.fits'
sat_map_ifs_slow = 'ifs_slow_sat_map.fits'
gain_ifs_slow = 1.0

sig_map_img_fast0p6 = 'readnoise_img_fast0.6_cd5.fits'
flat_img_fast0p6 = 'img_fast0.6_mflatlamp.fits'
lin_coeff_img_fast0p6 = 'linearity_img_fast0.6.fits'
sat_map_img_fast0p6 = 'img_fast0.6_sat_map.fits'
gain_img_fast0p6 = 1.0

sig_map_img_fast1 = 'readnoise_img_fast1.0_cd5.fits'
flat_img_fast1 = 'img_fast1.0_mflatlamp.fits'
lin_coeff_img_fast1 = 'linearity_img_fast1.0.fits'
sat_map_img_fast1 = 'img_fast1.0_sat_map.fits'
gain_img_fast1 = 1.0

sig_map_img_slow = 'readnoise_img_slow_cd5.fits'
flat_img_slow = 'img_slow_mflatlamp.fits'
bpm_img = 'bpm_img.fits'
bpmat_img = 'bpmat_img.npz'
lin_coeff_img_slow = 'linearity_img_slow.fits'
sat_map_img_slow = 'img_slow_sat_map.fits'
gain_img_slow = 1.0

procfile = scales.proc
