C2_rmat_MedRes_M = 'MedRes-M_C2_intp_rectmat.npz'

do_chi2_full = False

#
#
#Extra calibration steps
#
#

#Subtract the median of each row to get rid of pickup noise?
subtract_row_median = False

#Subtract the median of each row to get rid of pickup noise?
subtract_col_median = False

#Subtract the median of each image readout channel in addition to refpix?
subtract_img_readout_channels = False



procfile = scales.proc
