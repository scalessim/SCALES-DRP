[SCALES]
#
# Configuration file for start_scales_rmat_shift
#
# A single monochromator (CALUNIT) frame is reduced to L1 with the same
# detector-level processing as start_scales_calib_sa (StartCalibSA), so keep
# the detector settings below in step with the config used for the scan.
#

#
#
#Rectmat shift configuration
#
#

#Directory holding the monochromator scan products: *_mcalunit.fits,
#{IFSMODE}_lams.fits, {IFSMODE}_gauss_spotpars.fits and
#{IFSMODE}_gauss_spotpars_interpd.fits. Usually given with -r on the command line.
rmat_scan_dir = None

#Where the shifted rectmats, the shift summary and rmat_shift_log.csv are written
rmat_out_directory = '.'

#Largest wavelength difference (nm) accepted between the frame's MONOWAVE
#and the scan mcalunit it is matched to. Only masters the scan kept (those in
#{IFSMODE}_lams.fits, i.e. with spot fits; not dropped by mono_wave_range /
#mono_exclude_waves) can be matched; if none is within this, the run stops.
wave_match_tol_nm = 0.5

#Each spot is Gaussian-fitted in the frame the same way ProcessMonochrom fitted
#the scan (its {IFSMODE}_posarr.fits box, the rectmat_fluxcut below, Gaussian2D,
#LevMarLSQ), and the shift is the sigma-clipped median of (frame fit - scan fit),
#i.e. in the Gaussian-center convention the rectmats use. Spots used must have a
#high-passed peak above this many times the noise in both the frame and the scan.
rmat_shift_snr_min = 10.0

#Fewer spots than this -> fall back to the cross-correlation shift
rmat_shift_min_spots = 20

#The spots at one wavelength sit on the lenslet lattice, so a shift is only
#unique to within one lattice step. The cross-correlation peak is searched
#in a box of +-rmat_shift_max px around (rmat_shift_guess_dx, rmat_shift_guess_dy).
#rmat_shift_max is one number or [max_dx, max_dy]. None = half the lenslet
#pitch on each axis minus 0.5 px, measured from the scan's spot fits
#(LowRes: pitch ~18.9 x 20.4 px -> +-8.9 x +-9.7 px).
#Set a guess if the shift is expected to be larger than that.
rmat_shift_max = None
rmat_shift_guess_dx = 0.0
rmat_shift_guess_dy = 0.0

#Fit an affine model (shift + x/y scale + rotation + shear) to the per-spot
#offsets instead of a single x/y shift, and apply it to every spot position
#when rebuilding the rectmats. Use when the spot pattern also changed scale
#(e.g. a field-dependent shift). Also --affine on the command line.
rmat_shift_affine = False

#Which shifted rectmats to write: 'all', or a list of
#  OPT_intp, C2_intp         - from the Gaussian spot fits ({mode}_gauss_spotpars_interpd)
#  AnK_OPT_intp, AnK_C2_intp - from the A&K ePSFs ({mode}_ank_epsf + _gauss_spotpars)
#                              ('AnK_intp' is still accepted for AnK_OPT_intp)
#  OPT, C2                   - from the scan images ({mode}_posarr + the background-
#                              subtracted masters, see rmat_make_noninterp_rmats), LowRes
#Kinds whose inputs are not in the scan directory are skipped with a warning.
#MedRes scans have the Gaussian interpolated rectmats, and the A&K ones if the scan
#was reduced with medres_ank_epsf.
rmat_shift_rectmats = 'all'

#Non-interpolated (OPT, C2) rectmats: they are cut from the scan's background-subtracted
#masters. False = make them only if the scan has {mode}_calim_stack.fits (current
#ProcessMonochrom does not save it, so they are usually skipped); True = make them by
#rebuilding the masters one at a time from the scan's *_mcalunit.fits and its
#{mode}_bkg_template.fits (or, for older scans, the scaled mean of the masters), as the
#scan made them (~2 s per master). Also --make_noninterp_rmats.
#apply_destripe below is used for the rebuilt masters too; keep it equal to the scan's.
rmat_make_noninterp_rmats = False

#Sub-wavelengths per channel for the AnK rectmat; use the scan's value
#(ank_rectmat_nsub in scales_calib_sa.cfg)
ank_rectmat_nsub = 10

#Measure and log the shift only, without writing rectmats (fast)
rmat_measure_only = False

#Dedicated background frame(s) for the monochromator frame (required),
#usually given with -b. It must be spot free: normally a lamp-off frame taken
#with the spot frame. The spot image is L1(frame) - L1(background), which
#removes the continuum traces exactly. (Running-median filters and the scan's
#mean image do not remove the traces well enough on their own.)
rmat_background_frames = None

#Background check (a safeguard; a lamp-off background always passes). A
#background that contains spots leaves negative spots in the difference
#image. If more than rmat_neg_spot_frac_max of the frame's spots have a
#negative spot (below -rmat_shift_snr_min x noise) within rmat_bkg_min_sep_px
#px, the result is flagged CHECK.
rmat_bkg_min_sep_px = 7.0
rmat_neg_spot_frac_max = 0.1

#Row destripe after background subtraction (as ProcessMonochrom); off by default
apply_destripe = False

#Same options ProcessMonochrom uses when building rectmats; rectmat_fluxcut is
#also the flux cut for the Gaussian fits, so keep it equal to the scan's value
rectmat_fluxcut = 0.0
medres_force_ysigma = True

#Reuse an existing L1 for the frame instead of reprocessing the raw ramp
clobber = False

#Products made by StartCalibSA: only the L1 (CALUNIT) is needed here
create_rectmat = True
create_linearity_coeff = False
create_sat_map = False
create_bpm = False
create_readnoise = False

##odd even column swapping in detector fast mode
do_swap = False
#
#
#detector level corrections
nchans=4
altcol=True
channelwise=True
amp_mean_func=robust.mean
do_acn=True
acn_avg_type='pix'
acn_mean_func=np.median
acn_smooth=True
acn_savgol=False
acn_winsize=31
acn_order=3
resid_colsub=False
fixcol=True
ref_avg_type='row_wise'
ref_mean_func=np.median
ref_smooth=True
ref_savgol=False
ref_winsize=31
ref_order=3
pickup=False
sigma_thresh=4.0
dilate_iter=2
highpass_size=101
per_amp=False

##linearity correction needed or not
do_linearity = True

#Do you like to apply saturation mask to ramp fitting
apply_sat_mask=True

#Do you like to apply bad pixel mask to the slope image?
apply_bpm = True

subtract_row_median = False
subtract_col_median = False
subtract_img_readout_channels = False

#Set output directory (L1 files)
output_directory = 'redux/'
plot_directory = 'plots/'

#Path to folder containing required calibration files
#(currently must be a subdirectory inside scalesdrp)
calib_file_path = 'calib/'

#Calibration file names (must be inside calib directory)
sig_map_ifs_fast0p6 = 'readnoise_ifs_fast0.6_cd5.fits'
flat_ifs_fast0p6 = 'ifs_fast0.6_mflatlamp.fits'
bpm_ifs = 'bpm_ifs_cd5.fits'
bpmat_ifs = 'bpmat_ifs.npz'
lin_coeff_ifs_fast0p6 = 'linearity_ifs_fast0.6.fits'
sat_map_ifs_fast0p6 = 'ifs_fast0.6_sat_map.fits'
gain_ifs_fast0p6 = 1.0

sig_map_ifs_fast1 = 'readnoise_ifs_fast1.0_cd5.fits'
flat_ifs_fast1 = 'ifs_fast0.6_pseudoflat_bpcorr.fits'
lin_coeff_ifs_fast1 = 'linearity_ifs_fast1.0.fits'
sat_map_ifs_fast1 = 'ifs_fast1.0_sat_map.fits'
gain_ifs_fast1 = 1.0

sig_map_ifs_slow = 'readnoise_ifs_slow_cd5.fits'
flat_ifs_slow = 'ifs_fast0.6_pseudoflat_bpcorr.fits'
lin_coeff_ifs_slow = 'linearity_ifs_slow.fits'
sat_map_ifs_slow = 'ifs_slow_sat_map.fits'
gain_ifs_slow = 1.0

sig_map_img_fast0p6 = 'readnoise_img_fast0.6_cd5.fits'
flat_img_fast0p6 = 'img_fast0.6_mflatlamp.fits'
lin_coeff_img_fast0p6 = 'linearity_img_fast0.6.fits'
sat_map_img_fast0p6 = 'img_fast0.6_sat_map.fits'
gain_img_fast0p6 = 1.0

sig_map_img_fast1 = 'readnoise_img_fast1.0_cd5.fits'
flat_img_fast1 = 'img_fast1.0_mflatlamp.fits'
lin_coeff_img_fast1 = 'linearity_img_fast1.0.fits'
sat_map_img_fast1 = 'img_fast1.0_sat_map.fits'
gain_img_fast1 = 1.0

sig_map_img_slow = 'readnoise_img_slow_cd5.fits'
flat_img_slow = 'img_slow_mflatlamp.fits'
bpm_img = 'bpm_img.fits'
bpmat_img = 'bpmat_img.npz'
lin_coeff_img_slow = 'linearity_img_slow.fits'
sat_map_img_slow = 'img_slow_sat_map.fits'
gain_img_slow = 1.0

procfile = scales.proc
